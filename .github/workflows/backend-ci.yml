name: backend-ci

on:
  pull_request:
  push:
    branches: [main, "brain/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: todd
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: todd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todd -d todd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://todd:test-only@127.0.0.1:5432/todd_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://todd:test-only@127.0.0.1:5432/todd_test?sslmode=disable
      TODD_RUNTIME_MODE: demo
      AI_PROVIDER: mock
      FINGERPRINT_SECRET: ci-test-only
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: todd
      PGPASSWORD: test-only
      PGDATABASE: todd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run typecheck
      - name: Rehearse dataful upgrade
        run: npm run test:migration:upgrade
      - name: Apply migrations
        run: npm run db:migrate:deploy
      - name: Prove migration rerun
        run: npm run db:migrate:deploy
      - run: npm run test:postgres:existing
      - run: npm run build
